name: iOS IPA (unsigned)

# 署名なしの .ipa をビルドして artifact にする（手動実行）。
# 端末へは AltStore / SideStore / Sideloadly 等で、自分の Apple ID で再署名して入れる
# （無料アカウントの署名は 7 日で失効する。有料の Apple Developer Program は不要）。
# macOS ランナーは private リポジトリだと無料枠を 10 倍で消費する（1 回 15 分前後 = 150 分相当）ため、手動実行のみ。
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # アプリが接続する Worker（ビルド時に埋め込む。tauri/src-tauri/src/config.rs）
      AITAPP_WORKER_BASE_URL: https://aitapp.shiki-01.com
      AITAPP_APP_ORIGIN: https://aitapp.shiki-01.com
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install iOS tooling
        run: brew install xcodegen

      - name: Install Tauri CLI
        working-directory: tauri
        run: bun install --frozen-lockfile

      # Xcode の Run Script ビルドフェーズ（cargo build を呼ぶ）は、このジョブの `env:`
      # （AITAPP_WORKER_BASE_URL 等）を引き継がない。プロジェクト直下の .cargo/config.toml も
      # 効かなかった（Xcode が cwd を DerivedData 配下にして cargo を呼んでおり、そこから親を
      # 辿ってもプロジェクトの .cargo/ に届かないため、生成物に localhost の値が埋め込まれたままだった。
      # run 36522038572 で確認）。cwd に依存しない $CARGO_HOME/config.toml に書く。
      - name: Configure build-time env for Xcode's cargo build
        run: |
          mkdir -p "$CARGO_HOME"
          cat >> "$CARGO_HOME/config.toml" <<EOF
          [env]
          AITAPP_WORKER_BASE_URL = { value = "${AITAPP_WORKER_BASE_URL}", force = true }
          AITAPP_APP_ORIGIN = { value = "${AITAPP_APP_ORIGIN}", force = true }
          EOF
          cat "$CARGO_HOME/config.toml"

      - name: Generate iOS project and icons
        working-directory: tauri
        run: |
          # アイコンは init の後に生成する。先に生成すると init が Tauri 既定のアイコンで
          # AppIcon.appiconset を上書きし、ビルドが既定アイコンのままになる（TestFlight ビルド 7〜9 で確認）。
          bun run tauri ios init --ci
          bun run tauri icon src-tauri/icons/icon.png
          APPICONSET=src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset
          cp src-tauri/icons/ios/*.png "$APPICONSET"/
          cmp src-tauri/icons/ios/AppIcon-512@2x.png "$APPICONSET/AppIcon-512@2x.png"

      - name: Disable code signing in the generated project
        working-directory: tauri/src-tauri/gen/apple
        run: |
          ls
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("project.yml")
          s = p.read_text()
          # ターゲットの settings.base に署名無効の設定を足す
          add = "\n        CODE_SIGNING_ALLOWED: NO\n        CODE_SIGNING_REQUIRED: NO\n        CODE_SIGN_IDENTITY: \"\"\n"
          s2, n = re.subn(r"(\n      base:\n)", r"\1        CODE_SIGNING_ALLOWED: NO\n        CODE_SIGNING_REQUIRED: NO\n        CODE_SIGN_IDENTITY: \"\"\n", s, count=1)
          if n == 0:
              raise SystemExit("project.yml の settings.base が見つからない: 構造を確認すること")
          p.write_text(s2)
          print(s2)
          PY
          xcodegen generate

      - name: Build (archive)
        working-directory: tauri
        # export（署名が要る）は失敗してよい。archive が出来ていれば .app を取り出せる。
        run: bun run tauri ios build --target aarch64 --export-method debugging --ci || true

      - name: Package unsigned IPA
        run: |
          set -eux
          ARCHIVE=$(find tauri/src-tauri/gen/apple -name '*.xcarchive' -maxdepth 4 | head -1)
          test -n "$ARCHIVE"
          APP=$(find "$ARCHIVE/Products/Applications" -name '*.app' -maxdepth 1 | head -1)
          test -n "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry aitapp-unsigned.ipa Payload
          ls -la aitapp-unsigned.ipa

      # AITAPP_WORKER_BASE_URL/AITAPP_APP_ORIGIN がバイナリに正しく埋め込まれたかを検証する
      # （Xcode の Run Script が env を引き継がない問題の回帰確認。artifact をダウンロードできない
      #   ネットワークからでも、この時点でログに正誤が残る）。
      - name: Verify embedded worker URL in the binary
        run: |
          set -eux
          ARCHIVE=$(find tauri/src-tauri/gen/apple -name '*.xcarchive' -maxdepth 4 | head -1)
          APP=$(find "$ARCHIVE/Products/Applications" -name '*.app' -maxdepth 1 | head -1)
          BIN=$(find "$APP" -maxdepth 1 -type f -perm +111 | head -1)
          test -n "$BIN"
          echo "binary: $BIN"
          # strings は隣接する文字列リテラルをヌル区切りなしで連結して1行として出すことがあるため
          # 行完全一致(-x)ではなく部分一致で見る。localhost:8787(AITAPP_WORKER_BASE_URLの
          # デフォルト値そのもの)が残っていないことを本体判定にする
          # （devUrl由来のlocalhost:5173はTauri標準の設定文字列で無害なため対象外）。
          HAS_PROD=$(strings -a "$BIN" | grep -c "aitapp\.shiki-01\.com" || true)
          HAS_LOCAL_WORKER=$(strings -a "$BIN" | grep -c "localhost:8787" || true)
          echo "aitapp.shiki-01.com 出現数: $HAS_PROD / localhost:8787 出現数: $HAS_LOCAL_WORKER"
          if [ "$HAS_PROD" -gt 0 ] && [ "$HAS_LOCAL_WORKER" -eq 0 ]; then
            echo "OK: 本番 Worker URL が埋め込まれ、localhost:8787 は残っていない"
          else
            echo "NG:"
            strings -a "$BIN" | grep -E "localhost:8787|aitapp\.shiki-01\.com" || echo "(該当なし)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aitapp-unsigned-ipa
          path: aitapp-unsigned.ipa
          retention-days: 7
