name: iOS TestFlight (signed)

# 署名付きの .ipa をビルドして TestFlight にアップロードする（手動実行・2 か月ごとの定期実行）。
# 自動署名（App Store Connect API キー）方式。Mac・手動の証明書は不要。必要な Secrets は README の「iOS / TestFlight」参照。macOS ランナーは private だと無料枠を 10 倍で消費するため、実行は手動と 2 か月ごとの定期実行のみ。
on:
  workflow_dispatch:
  # TestFlight のビルドは 90 日で期限切れになるため、2 か月ごと（間隔 59〜62 日）に再ビルドして再アップロードする。
  # ビルド番号は github.run_number で毎回増える。
  schedule:
    - cron: '0 3 1 */2 *'

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPLE_API_KEY: ${{ secrets.APPSTORE_KEY_ID }}
      # アプリが接続する Worker（ビルド時に埋め込む。tauri/src-tauri/src/config.rs）
      AITAPP_WORKER_BASE_URL: https://aitapp.shiki-01.com
      AITAPP_APP_ORIGIN: https://aitapp.shiki-01.com
    steps:
      - uses: actions/checkout@v4

      # App Store Connect へのアップロードは iOS 26 SDK（Xcode 26 以降）でのビルドが必須
      # （run 38487969084: "SDK version issue. This app was built with the iOS 18.5 SDK"）。
      - name: Select Xcode 26
        run: |
          set -eu
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "Xcode 26 がランナーに見つかりません。runs-on を macos-26 に変更してください"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Write and verify App Store Connect API key
        env:
          P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          SECRET_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$P8" > "$KEY_FILE"
          echo "APPLE_API_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
          # 値そのものは出さず、形式だけ確認する
          echo "p8 行数: $(wc -l < "$KEY_FILE") / 先頭: $(head -1 "$KEY_FILE") / 末尾: $(tail -1 "$KEY_FILE")"
          echo "Key ID 桁数: ${#KEY_ID} / Issuer ID 桁数: ${#ISSUER_ID}"
          python3 -m venv /tmp/ascvenv
          /tmp/ascvenv/bin/pip install --quiet pyjwt cryptography
          /tmp/ascvenv/bin/python - "$KEY_FILE" "$KEY_ID" "$ISSUER_ID" "$GITHUB_ENV" "$SECRET_TEAM_ID" <<'PY'
          import sys, os, time, json, urllib.request, urllib.error, jwt
          key_file, key_id, issuer, github_env, secret_team = sys.argv[1:6]
          token = jwt.encode(
              {"iss": issuer, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              open(key_file).read(), algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
          def get(path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
          st, body = get("/v1/apps?limit=200")
          print("GET /v1/apps ->", st)
          if st != 200:
              print(body)
              sys.exit("API キー認証に失敗: Key ID / Issuer ID / .p8 の組み合わせ、またはキーの種類（個人キーは Issuer ID なし）を確認")
          ids = [a["attributes"]["bundleId"] for a in body["data"]]
          print("登録済みアプリ:", ids)
          if "com.shiki01.aitapp" not in ids:
              sys.exit("App Store Connect に com.shiki01.aitapp のアプリがありません")
          # Team ID は Bundle ID の seedId から取得し、Secret の値と照合する（不一致なら API の値を使う）
          st, body = get("/v1/bundleIds?filter[identifier]=com.shiki01.aitapp&limit=5")
          print("GET /v1/bundleIds ->", st)
          if st != 200 or not body["data"]:
              print(body)
              sys.exit("Bundle ID com.shiki01.aitapp が Apple Developer に登録されていません")
          seed = body["data"][0]["attributes"]["seedId"]
          print("Team ID 一致:", seed == secret_team.strip(), "/ Secret の長さ:", len(secret_team), "/ API の seedId:", " ".join(seed))
          with open(github_env, "a") as f:
              f.write("DETECTED_TEAM_ID=" + seed + "\n")
              f.write("APPLE_DEVELOPMENT_TEAM=" + seed + "\n")
          st, body = get("/v1/certificates?limit=200")
          print("GET /v1/certificates ->", st)
          PY

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install iOS tooling
        run: brew install xcodegen

      - name: Install Tauri CLI
        working-directory: tauri
        run: bun install --frozen-lockfile

      # Xcode の Run Script ビルドフェーズ（cargo build を呼ぶ）は、このジョブの `env:`
      # （AITAPP_WORKER_BASE_URL 等）を引き継がない。プロジェクト直下の .cargo/config.toml も
      # 効かなかった（Xcode が cwd を DerivedData 配下にして cargo を呼んでおり、そこから親を
      # 辿ってもプロジェクトの .cargo/ に届かないため、生成物に localhost の値が埋め込まれたままだった。
      # run 36522038572 で確認）。cwd に依存しない $CARGO_HOME/config.toml に書く。
      - name: Configure build-time env for Xcode's cargo build
        run: |
          mkdir -p "$CARGO_HOME"
          cat >> "$CARGO_HOME/config.toml" <<EOF
          [env]
          AITAPP_WORKER_BASE_URL = { value = "${AITAPP_WORKER_BASE_URL}", force = true }
          AITAPP_APP_ORIGIN = { value = "${AITAPP_APP_ORIGIN}", force = true }
          EOF
          cat "$CARGO_HOME/config.toml"

      - name: Generate iOS icons and project
        working-directory: tauri
        run: |
          bun run tauri icon src-tauri/icons/icon.png
          bun run tauri ios init --ci

      # アーカイブまでは Tauri に任せる。Tauri が呼ぶ exportArchive には API キーの認証情報が渡らず
      # （run 38359123008: "No Account for Team" / "No profiles for ... were found"）、プロファイルを
      # 自動作成できないため、エクスポートは次のステップで API キー付きの xcodebuild で行う。
      # ビルド番号(CFBundleVersion)は TestFlight へのアップロードごとに増やす必要がある。
      - name: Build archive
        working-directory: tauri
        run: bun run tauri ios build --export-method app-store-connect --build-number "${{ github.run_number }}" --ci || true

      - name: Export signed IPA (automatic signing with API key)
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -eux
          TEAM_ID="$DETECTED_TEAM_ID"
          ARCHIVE=$(find tauri/src-tauri/gen/apple -name '*.xcarchive' -maxdepth 4 | head -1)
          test -n "$ARCHIVE"
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          rm -rf export
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          IPA=$(find export -name '*.ipa' | head -1)
          test -n "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - uses: actions/upload-artifact@v4
        with:
          name: aitapp-signed-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 7
