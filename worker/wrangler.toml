name = "aitapp-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# 本番URL。Custom Domain（DNS・証明書はデプロイ時に自動設定）。
# workers.dev の既定URL（aitapp-worker.kishintorii.workers.dev）も併存する。
routes = [
  { pattern = "aitapp.shiki-01.com", custom_domain = true }
]

# フロント（web/build）を同一オリジンで静的配信する（Workers Static Assets、無料）。
# 単一オリジン（aitapp.shiki-01.com）に API とフロントを同居させることで、
# SameSite=Strict の session cookie と CORS の制約を丸ごと回避する。
# デプロイ前に web/ 側で `VITE_API_BASE=https://aitapp.shiki-01.com bun run build` を実行しておくこと。
# run_worker_first: 全リクエストを Worker に通し、Basic 認証（WEB_BASIC_AUTH）を
# 適用してから ASSETS binding 経由で配信する（router.ts のフォールバックルート）。
[assets]
directory = "../web/build"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Workers KV: ユーザー状態を 1 ユーザー 1 key で保持する。
# `wrangler kv namespace create USER_KV` で作成し、出力された id を埋める。
kv_namespaces = [
  { binding = "USER_KV", id = "171403a15680458abc9da653d4931403", preview_id = "365e6244b925476b9fecea11cf792e24" }
]

[vars]
# フロント(SvelteKit)のオリジン。CORS / Origin チェックに使用する。
# 本番はフロントを Worker 自身が静的配信するため API と同一オリジン。
# ローカル開発時（vite dev 分離構成）は worker/.dev.vars に
# APP_ORIGIN=http://localhost:5173 を書いて上書きする。
APP_ORIGIN = "https://aitapp.shiki-01.com"
# フロント静的配信の Basic 認証（"user:pass"）。API/MCP には適用されない。
WEB_BASIC_AUTH = "admin:admin"
# /api/schedule の reload ループ回数（subrequest 上限のため Dart の 25 から縮小）。
SCHEDULE_WEEKS = "8"
# LCAM 中継 relay の URL。LCAM の WAF が Cloudflare の egress IP を拒否するため
# （MIGRATION_NOTES §13.1）、本番では LCAM 宛のみ非 Cloudflare の relay 経由にする。
# コメントアウトすると LCAM へ直接 fetch（relay 未構築時の挙動）に戻る。
# LCAM_RELAY_TOKEN は wrangler secret put で投入済みであること。
LCAM_RELAY_URL = "https://relay.shiki-01.com"

# シークレットは vars に書かず wrangler secret で投入する:
#   wrangler secret put CRED_KEY        # credential 暗号化鍵（AES-GCM）
#   wrangler secret put SESSION_SECRET  # session cookie 署名鍵（HMAC-SHA256）
#   wrangler secret put LCAM_RELAY_TOKEN # LCAM 中継 relay の Bearer トークン（LCAM_RELAY_URL とセット）
#
# /mcp（Streamable HTTP MCP サーバー）を有効にする場合は追加で:
#   wrangler secret put MCP_TOKEN              # /mcp の Bearer トークン
#   wrangler secret put AITAPP_ID              # 大学ポータルのログインID
#   wrangler secret put AITAPP_PASSWORD        # 大学ポータルのパスワード
#   wrangler secret put AITAPP_MOODLE_ORIGIN   # 例: cms.aitech.ac.jp（未設定ならMoodle系ツール無効）
#   （LCAMとMoodleのアカウントが別の場合のみ）
#   wrangler secret put AITAPP_MOODLE_ID
#   wrangler secret put AITAPP_MOODLE_PASSWORD
# 未設定なら /mcp は 404 を返すだけで、既存 API に影響しない。

# /mcp が ../mcp/src のツール実装を取り込む際、zod / MCP SDK を worker 側の
# node_modules に一本化する（mcp/node_modules との二重バンドルを防ぐ）。
[alias]
"zod" = "./node_modules/zod"
"@modelcontextprotocol/sdk" = "./node_modules/@modelcontextprotocol/sdk"
